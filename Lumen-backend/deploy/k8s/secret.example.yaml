# EXAMPLE ONLY — do not commit real values. In a cluster prefer IRSA for AWS and
# External Secrets Operator / Secrets Store CSI to pull these from AWS Secrets
# Manager, rather than a literal Secret.
apiVersion: v1
kind: Secret
metadata:
  name: lumen-backend-secrets
type: Opaque
stringData:
  # RDS requires TLS; keep sslmode=require in the URL.
  DATABASE_URL: "postgresql://lumen:CHANGEME@lumen.abc123.ap-south-1.rds.amazonaws.com:5432/lumen_db?schema=public&sslmode=require"
  # ElastiCache with encryption in transit uses rediss:// — the queue detects the
  # scheme and enables TLS.
  REDIS_URL: "rediss://lumen.abc123.cache.amazonaws.com:6379"
  JWT_SECRET: "CHANGEME-32-byte-hex"
  SUPABASE_URL: "https://your-project.supabase.co"
  SUPABASE_ANON_KEY: "CHANGEME"
  SMTP_HOST: "email-smtp.ap-south-1.amazonaws.com"
  SMTP_PORT: "465"
  SMTP_USER: "CHANGEME"
  SMTP_PASS: "CHANGEME"
  GOOGLE_MAPS_API_KEY: "CHANGEME"
  STRIPE_SECRET_KEY: "CHANGEME"
  # Shared with the AI service (lumen-ai-secrets). The backend sends it as
  # `Authorization: Bearer <key>`; the AI service now verifies it.
  FASTAPI_API_KEY: "CHANGEME-shared-with-lumen-ai"
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are deliberately absent: with IRSA
  # the SDK resolves credentials from the service account's role.
