# IRSA: bind this service account to an IAM role granting S3 access to the
# bucket. Because no static keys are set, the AWS SDK's default provider chain
# picks the role up automatically.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lumen-backend
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/lumen-backend-s3
